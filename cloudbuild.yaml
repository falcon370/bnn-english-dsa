options:
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _REGION: asia-south1
  _REPOSITORY: mern-repo
  _BACKEND_SERVICE: backend-service
  _FRONTEND_SERVICE: frontend-service
  _EMBEDDING_SERVICE: bnn-embedding-service
  _EPAPER_JOB: epaper-service

steps:

# Build embedding service image
- name: 'gcr.io/cloud-builders/docker'
  args: ['build','-t','${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/embedding-service','-f','./embedding-service/Dockerfile','.']

# Push embedding service image
- name: 'gcr.io/cloud-builders/docker'
  args: ['push','${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/embedding-service']

# Deploy embedding service
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  entrypoint: gcloud
  args: [
    'run','deploy','${_EMBEDDING_SERVICE}',
    '--image','${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/embedding-service',
    '--region','${_REGION}',
    '--platform','managed',
    '--allow-unauthenticated',
    '--memory','1Gi',
    '--cpu','1',
    '--concurrency','8',
    '--min-instances','0',
    '--max-instances','3',
    '--timeout','300',
    '--set-env-vars','MODEL_NAME=sentence-transformers/all-MiniLM-L6-v2,INFERENCE_BATCH_SIZE=32,MAX_TEXT_LENGTH=4000'
  ]

# Build backend image (context is repo root so epaper-printer can be included)
- name: 'gcr.io/cloud-builders/docker'
  args: ['build','-t','${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/backend','-f','./server/Dockerfile','.']

# Push backend
- name: 'gcr.io/cloud-builders/docker'
  args: ['push','${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/backend']

# Deploy backend
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  entrypoint: bash
  args: [
    '-lc',
    'EMBEDDING_URL="$(gcloud run services describe ${_EMBEDDING_SERVICE} --region ${_REGION} --format="value(status.url)")" && gcloud run deploy ${_BACKEND_SERVICE} --image ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/backend --region ${_REGION} --platform managed --allow-unauthenticated --memory 2Gi --cpu 2 --timeout 300 --update-env-vars EMBEDDING_SERVICE_URL="$${EMBEDDING_URL}",FACEBOOK_PAGE_ACCESS_TOKEN="EAAXo0hSxc1kBSNEwMM2fVZBVHz5wDXZBZCH5ZBD7BbOvJz8xk76Pwvj0ovGiZCxt6fALfV3oaxVxdiyfcD4ADs5Ub3u9mokOqefs4sRmKvbwRlVn6yxWvfzNbAbZBcoDUFODhca7DGThZBF9ALTnWTW7ycO0jfhL1ZChZCW04XV4jGwMfaTdVe1eHDphZC0RQIdS86HZBzB5QfHfVzM1mkhpleZB",INSTAGRAM_ACCESS_TOKEN="IGAAVEWFCVaZA9BZAFlhbVFVQ1k2WWNVSXZAmbDBaRlpGaXg1RTNQc1ViWWZA5c1pQXzJNMWVfRFowTVZAZAaU1pb054V3cxRXM2V2o3RGI1bEVMWHVvdUg1eFd3d2xMVENWRU9tRllzc0c0U2FHa01VRC10MDlzbHNkMk1oZA1ZAyVWlXbwZDZD"'
  ]

# Build epaper-service image
- name: 'gcr.io/cloud-builders/docker'
  args: ['build','-t','${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/epaper-service','./epaper-service']

# Push epaper-service
- name: 'gcr.io/cloud-builders/docker'
  args: ['push','${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/epaper-service']

# Deploy epaper-service as Cloud Run Job (high memory, isolated from backend)
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  entrypoint: gcloud
  args: [
    'run','jobs','deploy','${_EPAPER_JOB}',
    '--image','${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/epaper-service',
    '--region','${_REGION}',
    '--memory','768Mi',
    '--cpu','1',
    '--task-timeout','600',
    '--max-retries','2',
    '--set-env-vars','GCS_BUCKET=bnn-epaper,GCS_PREFIX=epaper,NEWS_API_BASE_URL=https://backend-service-682124901351.asia-south1.run.app,OUTPUT_DIR=/tmp/epaper'
  ]

# Build frontend image
- name: 'gcr.io/cloud-builders/docker'
  args: [
    'build',
    '-t', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/frontend',
    '--build-arg', 'NEXT_PUBLIC_API_BASE_URL=https://backend-service-682124901351.asia-south1.run.app',
    './client'
  ]

# Push frontend
- name: 'gcr.io/cloud-builders/docker'
  args: ['push','${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/frontend']

# Deploy frontend
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  entrypoint: gcloud
  args: [
    'run','deploy','${_FRONTEND_SERVICE}',
    '--image','${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/frontend',
    '--region','${_REGION}',
    '--platform','managed',
    '--allow-unauthenticated'
  ]
